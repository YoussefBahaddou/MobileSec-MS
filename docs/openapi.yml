openapi: 3.0.0
info:
  title: MobileSec Gateway API
  version: 0.1.0
paths:
  /scan:
    post:
      summary: Upload APK/IPA & start scan
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Scan accepted
  /scan/{id}:
    get:
      summary: Get scan status/result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scan result
  /report/{id}:
    get:
      summary: Get report file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report downloaded
