server:
  port: 8083

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - PreserveHostHeader
          routes:
            - id: analysis-upload
              uri: http://localhost:8082
              predicates:
                - Path=/api/analysis/upload
                - Method=POST
              filters:
                - StripPrefix=1
            - id: analysis-results
              uri: http://localhost:8082
              predicates:
                - Path=/api/analysis/results/**
                - Method=GET
              filters:
                - StripPrefix=1
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: false
